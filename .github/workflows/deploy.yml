name: Deploy SanGer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (hesangang.github.io 用户专属主页 => VITE_BASE 强制根路径)
        run: |
          # 本仓库 = hesangang.github.io（用户专属主页），发布在根域名下，base 强制 /
          # 不要用任何字符串拼接判断，避免 bash/GitHub expressions 边缘情况导致错误 base
          VITE_BASE="/"
          echo "VITE_BASE=$VITE_BASE"
          echo "VITE_BASE=$VITE_BASE" >> $GITHUB_ENV
          npm run build
          echo "--- dist/index.html（确认 assets 路径无用户名前缀）---"
          cat dist/index.html || true
          echo "--- dist/assets（确认文件存在，后面 Pages 404 就是 CDN 缓存问题）---"
          ls -1 dist/assets 2>/dev/null || true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
