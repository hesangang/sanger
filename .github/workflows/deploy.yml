name: Deploy SanGer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_BASE: /sanger/
        run: |
          set -e
          echo "[debug] package.json name + homepage"
          node -e "const {name,homepage}=require('./package.json'); console.log('name:', name); console.log('homepage:', homepage)"
          echo "[debug] vite base"
          grep -n "base:" vite.config.ts || true
          echo "[debug] public listing"
          ls -la public 2>/dev/null || echo "<empty>"
          echo "[debug] VITE_BASE=$VITE_BASE"
          npm run build
          echo "[debug] dist files"
          find dist -type f | sort
          echo "[debug] dist/index.html"
          cat dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
