name: Deploy SanGer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (auto-inject GitHub Pages sub-path base)
        env:
          # 用户专属仓库（<用户名>.github.io）走根路径 base="/"
          # 普通项目仓库（<用户名>.github.io/<repo>）走 "/<repo>/"
          GH_IS_USER_SITE: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) }}
          GH_REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ "$GH_IS_USER_SITE" = "true" ]; then
            VITE_BASE="/"
          else
            VITE_BASE="/$GH_REPO_NAME/"
          fi
          echo "VITE_BASE=$VITE_BASE"
          echo "VITE_BASE=$VITE_BASE" >> $GITHUB_ENV
          npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
