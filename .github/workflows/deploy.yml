name: Deploy SanGer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (auto-inject GitHub Pages sub-path base)
        env:
          # 关键：hesangang.github.io 这种用户专属仓库名
          #   => repository.name = "hesangang.github.io"，repository_owner = "hesangang"
          #   => 如果 name 等于 "<owner>.github.io" 就视为用户专属主页，base='/'
          # 其他项目仓库（如 sanger） => base="/sanger/"
          GH_REPO_OWNER: ${{ github.repository_owner }}
          GH_REPO_NAME: ${{ github.event.repository.name }}
        run: |
          EXPECTED_USER_SITE="${GH_REPO_OWNER}.github.io"
          if [ "$GH_REPO_NAME" = "$EXPECTED_USER_SITE" ]; then
            VITE_BASE="/"
          else
            VITE_BASE="/$GH_REPO_NAME/"
          fi
          echo "REPO_OWNER=$GH_REPO_OWNER"
          echo "REPO_NAME=$GH_REPO_NAME"
          echo "EXPECTED_USER_SITE=$EXPECTED_USER_SITE"
          echo "VITE_BASE=$VITE_BASE"
          echo "VITE_BASE=$VITE_BASE" >> $GITHUB_ENV
          npm run build
          echo "--- dist/index.html contains ---"
          cat dist/index.html || true
          echo "--- dist/assets listing ---"
          ls dist/assets 2>/dev/null || true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
