name: Deploy SanGer to GitHub Pages (gh-pages 分支)

on:
  push:
    branches: [main]
  workflow_dispatch:

# 本 workflow 走最稳妥的 gh-pages 分支发布方案：
# 1. main 分支 commit 进来
# 2. node 20 + npm ci + npm run build（base=/，hesangang.github.io 用户专属主页）
# 3. peaceiris/actions-gh-pages 把 dist/* 推到 gh-pages 分支
# 4. Settings → Pages → Source 选 "Deploy from branch" → gh-pages / root
permissions:
  contents: write

concurrency:
  group: "pages-gh-pages-branch"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy to gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with Vite (base=/ for hesangang.github.io)
        env:
          VITE_BASE: "/"
        run: |
          echo "VITE_BASE=$VITE_BASE"
          npm run build
          echo "--- dist/index.html ---"
          cat dist/index.html || true
          echo "--- dist/assets ---"
          ls -1 dist/assets 2>/dev/null || true
          echo "--- find dist -type f | sort ---"
          find dist -type f | sort

      - name: Deploy dist/ to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_message: "chore(pages): deploy SanGer from commit ${{ github.sha }}"
